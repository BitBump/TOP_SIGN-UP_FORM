<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" media="screen" 
          href="https://fontlibrary.org//face/tt2020-style-g" type="text/css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SING-UP FORM</title>
    <link rel="stylesheet" href="styleSheet.css">
</head>
<body>

    <div class="img_div">
        <img src="./images/bernd-dittrich-8oFMaFbpWL0-unsplash.jpg" 
             alt="leaf, orange-green veins"
             class="bkg_img">
        <div class="logo_bkg">
            <img class="odin_logo" src="./logos/odin-lined.png">
            <p class="logo_bnr">ODIN</p>
        </div>
        <p class="credits">Photo by 
            <a href="https://unsplash.com/@hdbernd">Bernd Dittrich</a> 
            on 
            <a href="https://unsplash.com/">Unsplash</a>
        </p>
    </div>
    <div class="content_div">
        <p class="bait">This is not a real online service! You know you need something <br>
                        like this in your life to help you realize your deepest dreams.<br> 
                        Sign up <em>now</em> to get started.<br><br>
                        You <em>know</em> you want to.</p>
        <div class="form_container">
            <form class="sgn_up_form" id="sgn_up_form" method="post" action="">
                <label class="form_label">Let's do this!</label>
                    <div class="fields_container">
                        <div class="field">
                            <label class="input_label" for="first_name">FIRST NAME</label>
                            <input type="text" id="first_name" name="first_name" value="Loki"
                                   minlength="2"
                                   maxlength="25">
                        </div>
                        <div class="field">
                            <label class="input_label" for="last_name">LAST NAME</label>
                            <input type="text" id="last_name" name="last_name" value="Icegiantson"
                                   minlength="2"
                                   maxlength="25">
                        </div>
                        <div class="field">
                            <label class="input_label" for="email">EMAIL</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="field">
                            <label class="input_label" for="phone_number">PHONE NUMBER</label>
                            <input type="tel" id="phone_number" name="phone_number" maxlength="14">
                        </div>
                        <div class="field">
                            <label class="input_label" for="password">PASSWORD</label>
                            <input type="text" id="password" name="password" required>
                        </div>
                        <div class="field">
                            <label class="input_label" for="conf_password">CONFIRM PASSWORD</label>
                            <input type="text" id="conf_password" name="conf_password" required>
                        </div>
                    </div>
            </form>
        </div>
        <button type="submit" class="submit_button" form="sgn_up_form">Create Account</button>
        <p class="login">Already have an account? <a href="" class="login_lnk">Log in</a></p>
    </div>
    
</body>
</html>
